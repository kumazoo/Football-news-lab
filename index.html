<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Transfer Lab | トララボ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="main-header">
    <p class="site-description">サッカー移籍情報特化サイト</p>

    <h1>
        <a href="index.html">
            <img src="transferlab_logo.jpg" alt="Football Transfer Lab" class="logo-img">
        </a>
    </h1>
</header>

<nav style="text-align: center; margin-top: 15px;">
    <a href="journalist.html" class="nav-btn">ジャーナリスト</a>
    <a href="archive.html?genre=rumor" class="nav-btn">噂ニュース</a>
    <a href="archive.html?genre=confirmed" class="nav-btn">確定ニュース</a>
</nav>

<main>
    <h2 class="section-title">注目ニュース</h2>
    <section id="featured-section" class="featured-grid"></section>

    <div style="width: 100%; height: 90px; background: #ddd; display: flex; align-items: center; justify-content: center; margin: 30px 0; color: #888; font-size: 12px;">ADVERTISEMENT</div>

    <h2 class="section-title">トップジャーナリスト</h2>
    <section id="top-journalists" class="journalist-mini-grid"></section>
    <div style="text-align: center; margin: 20px 0 50px;">
        <a href="journalist.html" class="filter-btn" style="text-decoration: none; display: inline-block; padding: 12px 40px; background-color: #333; color: #fff; border-radius: 25px; font-weight: bold;">すべてのジャーナリストを見る</a>
    </div>

    <h2 class="section-title">最新の噂ニュース</h2>
    <section id="rumor-feed" class="news-feed"></section>
    <div style="text-align: center; margin: 20px 0 50px;">
        <a href="archive.html?genre=rumor" class="filter-btn" style="text-decoration: none; display: inline-block; padding: 12px 40px; background-color: #333; color: #fff; border-radius: 25px; font-weight: bold;">すべての噂ニュースを見る</a>
    </div>

    <h2 class="section-title">最新の確定ニュース</h2>
    <section id="confirmed-feed" class="news-feed"></section>
    <div style="text-align: center; margin-top: 20px; margin-bottom: 0px;">
        <a href="archive.html?genre=confirmed" class="filter-btn" style="text-decoration: none; display: inline-block; padding: 12px 40px; background-color: #333; color: #fff; border-radius: 25px; font-weight: bold;">すべての確定ニュースを見る</a>
    </div>
</main>

<footer style="text-align: center; padding: 20px 0; border-top: 1px solid #eee; margin-top: 40px;">
    <div style="margin-bottom: 10px;">
        <a href="about.html" style="color: #666; text-decoration: none; font-size: 0.8rem; margin: 0 10px;">当サイトについて</a>
        <a href="contact.html" style="color: #666; text-decoration: none; font-size: 0.8rem; margin: 0 10px;">お問い合わせ</a>
        <a href="privacy.html" style="color: #666; text-decoration: none; font-size: 0.8rem; margin: 0 10px;">プライバシーポリシー</a>
    </div>
    <p style="font-size: 0.75rem; color: #888;">&copy; 2026 Football Transfer Lab</p>
</footer>

<script async src="https://iframely.net/embed.js"></script>

<script>
async function loadPage() {
    try {
        // キャッシュを強制的に回避して読み込み
        const response = await fetch('articles/list.json?v=' + new Date().getTime());
        const articles = await response.json();
        
        const latestArticles = articles.slice().reverse();
        
        // --- 1. 注目記事（featured: true）の表示 ---
        const featuredSection = document.getElementById('featured-section');
        featuredSection.innerHTML = '';
        const featuredList = latestArticles.filter(a => a.featured).slice(0, 2);

        featuredList.forEach(article => {
            const card = document.createElement('div');
            card.className = 'featured-card';
            
            const imageMaskContent = `
                <div class="featured-image-mask">
                    <div class="iframely-embed">
                        <div class="iframely-responsive">
                            <a href="${article.source_url}" data-iframely-url="https://iframely.net/${article.iframely_id}?theme=light&media=1"></a>
                        </div>
                    </div>
                </div>`;

            card.innerHTML = `
                ${imageMaskContent}
                <a href="articles/${article.id}.html" class="featured-overlay-link">
                    <div class="featured-text-content">
                        <h3 class="featured-title">${article.title}</h3>
                        <span class="featured-read-btn">ニュースをチェック</span>
                    </div>
                </a>
            `;
            featuredSection.appendChild(card);
        });

        // --- 2. トップジャーナリストの表示 ---
        renderTopJournalists(articles);

        // --- 3. 最新の噂ニュース (genre: rumor) の表示 (従来のtransferも移行措置として拾う) ---
        const rumorList = latestArticles.filter(a => a.genre === 'rumor' || a.genre === 'transfer').slice(0, 5);
        renderNewsFeed(rumorList, 'rumor-feed');

        // --- 4. 最新の確定ニュース (genre: confirmed) の表示 ---
        const confirmedList = latestArticles.filter(a => a.genre === 'confirmed').slice(0, 5);
        renderNewsFeed(confirmedList, 'confirmed-feed');

        // Iframelyの再読み込み
        if (window.iframely) {
            iframely.load();
        } else {
            // スクリプトがまだ読み込まれていない場合、少し待ってから実行
            setTimeout(() => { if (window.iframely) iframely.load(); }, 1000);
        }
    } catch (e) {
        console.error("Failed to load articles.", e);
    }
}

// ニュースフィード生成用共通関数（カラーと下線はCSSで一括管理）
function renderNewsFeed(list, targetId) {
    const container = document.getElementById(targetId);
    container.innerHTML = ''; 
    if (list.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#999; padding:20px;">現在、新しい記事はありません。</p>';
        return;
    }
    list.forEach(article => {
        const item = document.createElement('a');
        item.href = `articles/${article.id}.html`;
        item.className = 'news-item-link';
        
        const dateStr = article.id.substring(0,6);
        const formattedDate = `20${dateStr.substring(0,2)}.${dateStr.substring(2,4)}.${dateStr.substring(4,6)}`;

        const journalists = Array.isArray(article.journalist) ? article.journalist : (article.journalist ? [article.journalist] : []);
        const journalistText = journalists.length > 0 ? journalists.join(', ') : '---';

        // 💡 完全にクラス名だけで構造を整理しました。
        // タイトル部分に「news-title-text」というクラスを付与しています。
        item.innerHTML = `
            <article class="news-card">
                <div class="news-meta">
                    <span class="news-date" style="font-size: 0.75rem; color: #999; display: block; margin-bottom: 5px;">
                        ${formattedDate} | Journalist: ${journalistText}
                    </span>
                    <h3 class="news-title" style="margin: 0; font-size: 1rem; font-weight: bold;">
                        <span class="news-title-text">${article.title}</span>
                    </h3>
                </div>
            </article>
        `;
        container.appendChild(item);
    });
}

// ジャーナリストランキング生成用関数（自動集計版）
function renderTopJournalists(articles) {
    const journalistSection = document.getElementById('top-journalists');
    const statsMap = {};

    // 1. 全記事をスキャンしてジャーナリストごとに「確定数」「噂数」「噂的中」をカウント
    articles.forEach(a => {
        const journalists = Array.isArray(a.journalist) ? a.journalist : (a.journalist ? [a.journalist] : []);
        
        journalists.forEach(rawName => {
            const name = rawName.trim();
            if (!name) return;

            if (!statsMap[name]) {
                statsMap[name] = { name: name, confirmedCount: 0, rumorCorrect: 0, rumorTotal: 0 };
            }

            // 確定ニュース（confirmed）のカウント
            if (a.genre === 'confirmed') {
                statsMap[name].confirmedCount++;
            } 
            // 噂ニュース（rumor または 従来のtransfer）のカウント
            else if (a.genre === 'rumor' || a.genre === 'transfer' || !a.genre) {
                if (a.status === 'correct' || a.status === 'incorrect') {
                    statsMap[name].rumorTotal++;
                    if (a.status === 'correct') {
                        statsMap[name].rumorCorrect++;
                    }
                }
            }
        });
    });

    // 2. 噂の的中率を算出して配列化
    const journalistList = Object.values(statsMap).map(j => {
        const accuracy = j.rumorTotal > 0 ? Math.round((j.rumorCorrect / j.rumorTotal) * 100) : 0;
        return { name: j.name, accuracy: accuracy, rumorTotal: j.rumorTotal, confirmedCount: j.confirmedCount };
    });

    // 3. 噂の的中率順にソートしてトップ3を抽出（同じなら噂の判定件数が多い順）
    const top3 = journalistList.sort((a, b) => {
        if (b.accuracy !== a.accuracy) {
            return b.accuracy - a.accuracy;
        }
        return b.rumorTotal - a.rumorTotal;
    }).slice(0, 3);
    
    // 表示処理
    journalistSection.innerHTML = ''; 

    top3.forEach((j, idx) => {
        const medal = ['🥇', '🥈', '🥉'][idx];
        const div = document.createElement('div');
        div.style = "background: #fff; padding: 20px; border-radius: 10px; border: 1px solid #eee; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05);";
        div.innerHTML = `
            <div style="font-size: 1.5rem; margin-bottom: 8px;">${medal}</div>
            <div style="font-weight: bold; font-size: 1rem; margin-bottom: 8px;">
                <a href="archive.html?journalist=${encodeURIComponent(j.name)}" style="text-decoration: none; color: #2A6A35; border-bottom: 1px dashed #2A6A35;">${j.name}</a>
            </div>
            <div style="font-size: 0.8rem; color: #e91e63; font-weight: bold; margin-bottom: 4px;">噂的中率: ${j.accuracy}%</div>
            <div style="font-size: 0.7rem; color: #888;">(確定: ${j.confirmedCount}件 / 噂判定: ${j.rumorTotal}件)</div>
        `;
        journalistSection.appendChild(div);
    });
}

loadPage();
</script>

</body>
</html>
